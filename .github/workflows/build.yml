name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and export OpenAPI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp clean verify

      - name: Export OpenAPI spec
        run: |
          set -euo pipefail
          jar="$(ls target/*.jar | head -n 1)"
          java -jar "$jar" --server.port=8081 > app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 45); do
            if curl -fsS http://localhost:8081/actuator/health > /dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Application exited before becoming healthy:"
              cat app.log
              exit 1
            fi
            sleep 2
          done

          curl -fsS http://localhost:8081/v3/api-docs -o openapi.json
          python3 -m json.tool openapi.json > openapi.pretty.json
          mv openapi.pretty.json openapi.json
          echo "Documented paths:"
          python3 -c "import json; print('\n'.join(sorted(json.load(open('openapi.json'))['paths'])))"

      - name: Upload OpenAPI spec
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: openapi.json
          if-no-files-found: error

      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: mcp-order-server-jar
          path: target/*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload application log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-log
          path: app.log
          if-no-files-found: ignore

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mcp-order-server:${{ github.sha }}
