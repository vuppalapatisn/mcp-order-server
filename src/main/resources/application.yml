server:
  port: 8081

spring:
  application:
    name: mcp-order-server
  ai:
    mcp:
      server:
        name: mcp-order-server
        version: 1.0.0
        protocol: STREAMABLE

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
