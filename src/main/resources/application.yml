server:
  port: 8081

spring:
  application:
    name: mcp-order-server
  ai:
    mcp:
      server:
        name: mcp-order-server
        version: 1.0.0
        # STREAMABLE -> POST /mcp (session via mcp-session-id header)
        # SSE        -> GET /sse + POST /mcp/message
        # STATELESS  -> POST /mcp, no session, no SSE back-channel
        # Only one can be active at a time. Override with the MCP_PROTOCOL env var
        # so the transport can be switched per deployment without a rebuild.
        protocol: ${MCP_PROTOCOL:STREAMABLE}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
